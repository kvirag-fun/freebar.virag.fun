<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>freebar</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <button id="clip-plane-btn" class="icon-btn" type="button" aria-label="Cutting planes" title="Cutting planes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="1" />
            <path d="M2 13 L22 9" />
          </svg>
          <span class="tooltip">Cutting planes</span>
        </button>
      </header>
      <main id="viewport">
        <div id="panes"></div>
        <div id="clip-plane-banner" class="clip-plane-banner" hidden>
          <span>Click a point on the model to place the plane</span>
          <button id="clip-plane-cancel-btn" type="button">Cancel</button>
        </div>
      </main>
      <footer id="app-footer">
        <button id="nav-cube-btn" class="icon-btn active" type="button" aria-label="Minimize navigation cube" title="Minimize navigation cube">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" />
            <path d="M12 22 L12 12 M12 12 L21 7 M12 12 L3 7" />
          </svg>
          <span class="tooltip">Minimize navigation cube</span>
        </button>
        <button id="axis-gizmo-btn" class="icon-btn active" type="button" aria-label="Hide axis indicator" title="Hide axis indicator">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="12" y1="20" x2="21" y2="14" />
            <line x1="12" y1="20" x2="4" y2="10" />
          </svg>
          <span class="tooltip">Hide axis indicator</span>
        </button>
        <button id="split-view-btn" class="icon-btn" type="button" aria-label="Split view" title="Split view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="12" y1="4" x2="12" y2="20" />
          </svg>
          <span class="tooltip">Split view</span>
        </button>
      </footer>
    </div>
    <div id="clip-plane-dialog" class="modal-overlay" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Cutting planes</h2>
          <button id="clip-plane-close-btn" class="icon-btn" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <p id="clip-plane-empty" class="clip-plane-empty">No cutting planes yet.</p>
        <ul id="clip-plane-list" class="clip-plane-list"></ul>
        <button id="clip-plane-add-btn" class="clip-plane-add-btn" type="button">+ Add plane</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
