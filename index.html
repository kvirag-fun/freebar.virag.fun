<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>freebar</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <button id="upload-model-btn" class="icon-btn" type="button" aria-label="Upload STL model" title="Upload STL model">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16 L12 4" />
            <path d="M7 9 L12 4 L17 9" />
            <path d="M4 16 L4 19 A1 1 0 0 0 5 20 L19 20 A1 1 0 0 0 20 19 L20 16" />
          </svg>
          <span class="tooltip">Upload STL model</span>
        </button>
        <input id="upload-model-input" type="file" accept=".stl" hidden />
        <button id="clip-plane-btn" class="icon-btn" type="button" aria-label="Cutting planes" title="Cutting planes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="1" />
            <path d="M2 13 L22 9" />
          </svg>
          <span class="tooltip">Cutting planes</span>
        </button>
        <button id="snap-btn" class="icon-btn" type="button" aria-label="Point snapping" title="Point snapping">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4 L7 13 A5 5 0 0 0 17 13 L17 4" />
            <rect x="4" y="3" width="5" height="4" rx="1" fill="currentColor" stroke="none" />
            <rect x="15" y="3" width="5" height="4" rx="1" fill="currentColor" stroke="none" />
          </svg>
          <span class="tooltip">Point snapping</span>
        </button>
        <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
          </svg>
          <span class="tooltip">Settings</span>
        </button>
      </header>
      <main id="viewport">
        <div id="panes"></div>
        <div id="clip-plane-banner" class="clip-plane-banner" hidden>
          <span>Click a point on the model to place the plane</span>
          <button id="clip-plane-cancel-btn" type="button">Cancel</button>
        </div>
      </main>
      <footer id="app-footer">
        <button id="nav-cube-btn" class="icon-btn active" type="button" aria-label="Minimize navigation cube" title="Minimize navigation cube">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L21 7 L21 17 L12 22 L3 17 L3 7 Z" />
            <path d="M12 22 L12 12 M12 12 L21 7 M12 12 L3 7" />
          </svg>
          <span class="tooltip">Minimize navigation cube</span>
        </button>
        <button id="axis-gizmo-btn" class="icon-btn active" type="button" aria-label="Hide axis indicator" title="Hide axis indicator">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="12" y1="20" x2="21" y2="14" />
            <line x1="12" y1="20" x2="4" y2="10" />
          </svg>
          <span class="tooltip">Hide axis indicator</span>
        </button>
        <button id="split-view-btn" class="icon-btn" type="button" aria-label="Split view" title="Split view">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="12" y1="4" x2="12" y2="20" />
          </svg>
          <span class="tooltip">Split view</span>
        </button>
      </footer>
    </div>
    <div id="clip-plane-dialog" class="modal-overlay" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Cutting planes</h2>
          <button id="clip-plane-close-btn" class="icon-btn" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <p id="clip-plane-empty" class="clip-plane-empty">No cutting planes yet.</p>
        <ul id="clip-plane-list" class="clip-plane-list"></ul>
        <button id="clip-plane-add-btn" class="clip-plane-add-btn" type="button">+ Add plane</button>
      </div>
    </div>
    <div id="snap-dialog" class="modal-overlay modal-overlay-blocking" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Point snapping</h2>
          <button id="snap-close-btn" class="icon-btn" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <label class="snap-option">
          <input type="checkbox" id="snap-vertex-checkbox" checked />
          Snap to vertices
        </label>
        <label class="snap-option">
          <input type="checkbox" id="snap-midpoint-checkbox" checked />
          Snap to edge midpoints
        </label>
      </div>
    </div>
    <div id="settings-dialog" class="modal-overlay modal-overlay-blocking" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="settings-close-btn" class="icon-btn" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <p class="settings-section-label">Background</p>
        <div class="bg-swatch-group">
          <button class="bg-swatch" type="button" data-bg="light">
            <span class="bg-swatch-preview bg-swatch-preview-light"></span>
            White
          </button>
          <button class="bg-swatch active" type="button" data-bg="dark">
            <span class="bg-swatch-preview bg-swatch-preview-dark"></span>
            Black
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
